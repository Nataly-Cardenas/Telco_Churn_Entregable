name: Publicar Jupyter Book
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-book.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Verificar notebooks originales
        run: sha256sum --check notebooks.sha256
      - name: Instalar Jupyter Book
        run: python -m pip install -r requirements-book.txt
      - name: Construir con las salidas guardadas
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: jupyter book build --html
      - name: Comprobar que los notebooks siguen intactos
        run: sha256sum --check notebooks.sha256
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
