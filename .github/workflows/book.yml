name: Publicar Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-book.txt

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verificar notebooks originales
        run: sha256sum --check notebooks.sha256

      - name: Instalar Jupyter Book
        run: python -m pip install -r requirements-book.txt

      - name: Construir Jupyter Book
        run: jupyter-book build .

      - name: Comprobar que los notebooks siguen intactos
        run: sha256sum --check notebooks.sha256

      - name: Subir Jupyter Book
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4